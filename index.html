<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyNest — Student Learning Portal</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="app-shell">

    <!-- ── Sidebar ── -->
    <nav class="sidebar" id="sidebar" aria-label="Main navigation">

      <div class="sidebar-brand">
        <span class="brand-icon">🪴</span>
        <div>
          <div class="brand-name">StudyNest</div>
          <div class="brand-sub">Student Portal</div>
        </div>
      </div>

      <div class="sidebar-nav">
        <button class="nav-link active" data-page="dashboard">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">Dashboard</span>
        </button>
        <button class="nav-link" data-page="courses">
          <span class="nav-icon">📚</span>
          <span class="nav-label">Courses</span>
        </button>
        <button class="nav-link" data-page="calendar">
          <span class="nav-icon">📅</span>
          <span class="nav-label">Calendar</span>
        </button>
        <button class="nav-link" data-page="assignments">
          <span class="nav-icon">📝</span>
          <span class="nav-label">Assignments</span>
        </button>
        <button class="nav-link" data-page="grades">
          <span class="nav-icon">📊</span>
          <span class="nav-label">Grades</span>
        </button>
        <button class="nav-link" data-page="inbox">
          <span class="nav-icon">✉️</span>
          <span class="nav-label">Inbox</span>
          <span class="inbox-badge" aria-label="Unread messages"></span>
        </button>
        <button class="nav-link" data-page="settings">
          <span class="nav-icon">⚙️</span>
          <span class="nav-label">Settings</span>
        </button>
      </div>

      <div class="sidebar-footer">
        StudyNest v1.0 · Demo
      </div>

    </nav>

    <!-- ── Mobile overlay ── -->
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

    <!-- ── Main area ── -->
    <div class="main-area">

      <!-- Top bar -->
      <header class="topbar" role="banner">
        <button id="sidebar-toggle" aria-label="Open navigation menu" aria-expanded="false">☰</button>
        <span id="page-title">Dashboard</span>
        <div class="topbar-avatar" id="topbar-avatar" title="Student profile" aria-label="Student avatar">A</div>
      </header>

      <!-- Page content -->
      <main class="content-area" id="main-content" role="main" aria-live="polite">
        <!-- Rendered by app.js -->
      </main>

    </div><!-- /.main-area -->

  </div><!-- /.app-shell -->

  <!-- Scripts — order matters: data → storage → app -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
